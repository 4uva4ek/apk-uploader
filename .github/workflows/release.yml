name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check release version
        run: python tools/check_release_version.py
      - name: Build portable Windows application
        shell: pwsh
        run: |
          ./gradlew.bat :app:test :app:createReleaseDistributable --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_windows_updater.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ((Get-Content app.properties | Select-String '^version=').Line -split '=', 2)[1].Trim()
          $appDir = Resolve-Path app/build/compose/binaries/main-release/app/ApkUploader
          foreach ($file in @('ApkUploader.exe', 'runtime/bin/server/jvm.dll', 'app/ApkUploader.cfg',
                              'app/resources/adb.exe', 'app/resources/AdbWinApi.dll', 'app/resources/AdbWinUsbApi.dll',
                              'app/resources/libwinpthread-1.dll', 'app/resources/NOTICE.txt')) {
            if (!(Test-Path "$appDir/$file")) { throw "Missing $file" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $appDir -DestinationPath "dist/apk-uploader-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build portable Linux application
        run: |
          ./gradlew :app:test :app:createReleaseDistributable --console=plain
          version=$(sed -n 's/^version=//p' app.properties | tr -d '\r')
          root=app/build/compose/binaries/main-release/app
          for file in bin/ApkUploader lib/app/resources/adb lib/app/resources/NOTICE.txt; do
            test -f "$root/ApkUploader/$file" || { echo "Missing $file"; exit 1; }
          done
          test -x "$root/ApkUploader/lib/app/resources/adb" || { echo "adb is not executable"; exit 1; }
          mkdir -p dist
          tar -czf "dist/apk-uploader-$version-linux-x64.tar.gz" -C "$root" ApkUploader
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build portable macOS application
        run: |
          ./gradlew :app:test :app:createReleaseDistributable --console=plain
          version=$(sed -n 's/^version=//p' app.properties | tr -d '\r')
          root=app/build/compose/binaries/main-release/app
          for file in Contents/MacOS/ApkUploader Contents/app/resources/adb Contents/Resources/ApkUploader.icns; do
            test -f "$root/ApkUploader.app/$file" || { echo "Missing $file"; exit 1; }
          done
          test -x "$root/ApkUploader.app/Contents/app/resources/adb" || { echo "adb is not executable"; exit 1; }
          mkdir -p dist
          ditto -c -k --keepParent "$root/ApkUploader.app" "dist/apk-uploader-$version-macos-arm64.zip"
      - name: jpackage logs
        if: failure()
        run: cat app/build/compose/logs/*/*.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' app.properties | tr -d '\r')
          (cd dist && sha256sum apk-uploader-* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "APK Uploader $version" --notes-file "docs/RELEASE-$version.md" dist/*
